<style>
/* Layout: sticky balance bar over a sidebar (desktop) / bottom tab bar (phone); content is a single scrolling column of panels.

:root{--bg:#07070c;--bg2:#0c0c15;--pn:#11111b;--pn2:#181826;--pn3:#212135;--ln:#2a2a45;--tx:#eeecf9;--mu:#8f8dac;--pu:#a95cff;--bl:#35a7ff;--go:#ffc83d;--gr:#2dff8a;--rd:#ff4d6d;--pk:#f472b6;

 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh;overflow-x:hidden}

.col{min-width:0}
.side{display:none}

/* =================== POLISH PASS =================== */
:root{--r:16px}
body{background-image:radial-gradient(1000px 560px at 90% -10%,#a95cff1c,transparent 70%),radial-gradient(800px 520px at -10% 30%,#35a7ff12,transparent 70%)}
.page{animation:pgin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pn{background:linear-gradient(180deg,#15151f,#0f0f18);border-color:#25253c;box-shadow:0 1px 0 #ffffff08 inset}
.pn.flat{background:#0e0e17}
.pn>h3,.ph{font-size:11px;color:#8582a6}
.pagehead h1{letter-spacing:-.01em}
.pagehead p{font-size:13px;line-height:1.5}
/* top bar */
.top{padding:10px 0 8px;gap:12px}
.top .bal{gap:6px}
.chip{background:#12121c;border-color:#26263d;padding:6px 11px}
.chip b{font-weight:700}
.top .bal .chip:first-child{background:linear-gradient(180deg,#1d1a10,#12121c);border-color:#4a3c14}
.top .bal .chip:first-child b{color:#ffe08a;font-size:13px}
.me:hover .av{filter:brightness(1.15)}
/* sidebar */
.side-l{font:800 10px var(--fb);letter-spacing:.22em;text-transform:uppercase;color:#59577a;padding:16px 12px 6px}
.side .side-claim{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:linear-gradient(120deg,#2dff8a22,#17c9a014);border:1px solid #2dff8a66;color:#fff;animation:pulseGlow 2.4s infinite;box-shadow:0 0 20px #2dff8a22}
.side .side-claim b{font:800 12px var(--fb);color:var(--gr)}.side .side-claim span{font:600 11px var(--fb);color:var(--mu)}
.side .side-claim.m{background:linear-gradient(120deg,#f472b622,#a95cff14);border-color:#f472b688;box-shadow:0 0 20px #f472b622}.side .side-claim.m b{color:var(--pk)}
.side button{padding:9px 12px}
.side button.on{background:linear-gradient(90deg,#a95cff2e,transparent);border-color:transparent;box-shadow:inset 3px 0 0 var(--pu)}
.bnav{background:#0a0a12f5;padding-top:4px}
.bnav button{font-size:10px;padding:7px 2px;gap:2px}
.bnav button.on{background:none;color:#fff;position:relative}
.bnav button.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--pu);box-shadow:0 0 12px var(--pu)}
.bnav button.on svg{color:var(--pu);filter:drop-shadow(0 0 6px #a95cff99)}
/* tabs with edge fade */
.tabs{position:relative;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}

.tab.on{background:var(--pu);border-color:var(--pu);color:#fff;box-shadow:0 0 18px #a95cff55}
/* buttons */
.btn{border-radius:12px;background:#1b1b2b;border-color:#2c2c46}
.btn.sm{min-height:34px}
.btn.lg{font-size:15px;letter-spacing:.03em}

/* cards grid headers */

.garea{padding:18px}

function cosDef(id){return S.cosDefs[id]||SPECIAL_COSMETICS[id]||FREE_COSMETICS.find(c=>c.id===id)||null}
function giveReward(r,why){
  if(!r)return;
  if(r.coins||r.c)addCur('coins',r.coins||r.c,why);
  if(r.gems||r.g)addCur('gems',r.gems||r.g,why);
  if(r.tickets||r.t)addCur('tickets',r.tickets||r.t,why);
  if(r.x)addXP(r.x,why);
  if(r.bp)addBP(r.bp,why,true);
  const pk=r.packs||r.pk;if(pk)for(const k in pk)S.packs[k]=(S.packs[k]||0)+pk[k];
  const cos=r.cos;if(cos){const def=r.cdef||cosDef(cos)||BPCACHE.cos[cos];if(def){S.cosDefs[cos]=def;S.own[cos]=1}}
  touch();
}
function rewardParts(r){
  const a=[];if(!r)return a;
  const c=r.coins||r.c,g=r.gems||r.g,t=r.tickets||r.t;
  if(c)a.push({k:'coins',t:'+'+fmtK(c)+' coins'});if(g)a.push({k:'gems',t:'+'+g+' gems'});if(t)a.push({k:'tix',t:'+'+t+' tickets'});
  if(r.x)a.push({k:'xp',t:'+'+fmtK(r.x)+' XP'});if(r.bp)a.push({k:'bp',t:'+'+fmtK(r.bp)+' pass XP'});
  const pk=r.packs||r.pk;if(pk)for(const k in pk)a.push({k:'pack',t:pk[k]+'x '+PACKS[k].n});
  if(r.cos){const d=cosDef(r.cos)||BPCACHE.cos[r.cos];if(d)a.push({k:'cos',t:d.name})}
  if(r.badge)a.push({k:'badge',t:r.badge+' badge'});

}

function mkStep(c,m){const vol=[.012,.014,.02,.026,.032,.04,.05][c.r];
  m.d=(m.d||0)*.9+(Math.random()-.5)*vol*.5;let ni=m.i+(1-m.i)*.03+m.d+(Math.random()-.5)*vol*2;
  if(Math.random()<.004)ni*=Math.random()<.5?1.25:.8;m.i=clamp(ni,.45,2.8);m.h.push(Math.round(c.base*m.i));if(m.h.length>48)m.h.shift()}

  const pool=CARDS.filter(c=>c.r===ri),c=pool[Math.floor(Math.random()*pool.length)];
  const k=rollCondN(),inst={c:c.id,k,g:0};const val=instValue(inst);let f=.78+Math.random()*.55;if(Math.random()<.12)f=.72+Math.random()*.12;
  return {id:'n'+(S.lid++),c:c.id,k,g:0,price:Math.max(1,Math.round(val*f)),seller:BOTNAMES[Math.floor(Math.random()*BOTNAMES.length)],t:Date.now()}}
function rollCondN(){let r=Math.random(),a=0;for(let i=0;i<COND.length;i++){a+=COND[i].p;if(r<a)return i}return 1}
function rollCond(rf){let r=(rf||rnd)(),a=0;for(let i=0;i<COND.length;i++){a+=COND[i].p;if(r<a)return i}return 1}

  if(Math.random()<.6)S.npc.push(npcListing());if(S.npc.length>40)S.npc.shift()}
function processListings(quiet){
  for(let i=S.listings.length-1;i>=0;i--){const L=S.listings[i];const val=instValue(L.inst),ratio=L.price/val;
    const p=ratio<=.7?.55:ratio<=.9?.32:ratio<=1?.2:ratio<=1.1?.09:ratio<=1.25?.025:.003;
    if(Math.random()<p){const net=Math.floor(L.price*(1-LIST_FEE));S.listings.splice(i,1);addCur('coins',net,'Marketplace sale: '+CARD[L.inst.c].name);
      const profit=net-(L.inst.b||0);S.st.mktProfit+=profit;S.st.lsold++;S.st.sold++;
      S.sales.unshift({t:Date.now(),c:L.inst.c,k:L.inst.k,g:L.inst.g,price:L.price,net,profit,how:'listing'});if(S.sales.length>120)S.sales.length=120;
      if(!quiet){UI.toast(`<b>${esc(CARD[L.inst.c].name)}</b> sold for ${fmt(net)} coins (after 5% fee).`,'win');UI.sfx('coin')}

function pickW(w,mult,rf){rf=rf||rnd;let tot=0;const e=[];for(const k in w){let v=w[k];if(RIDX[k]>=2)v*=mult;if(v>0){e.push([k,v]);tot+=v}}let r=rf()*tot;for(const [k,v] of e){if((r-=v)<0)return k}return e[e.length-1][0]}
function rollPack(p,rf){rf=rf||rnd;const lk=luckMult(),out=[];
  p.slots.forEach(sl=>{const rid=pickW(sl,lk,rf),pool=packPool(p,rid),c=pool[Math.floor(rf()*pool.length)];out.push({c:c.id,k:rollCond(rf)})});
  out.sort((a,b)=>CARD[a.c].r-CARD[b.c].r||CARD[a.c].base-CARD[b.c].base);return out}
function addInstances(list,basisMode,paid){
  const map=ownedMap(),seen={},res=[];
  list.forEach(x=>{const inst={i:S.nid++,c:x.c,k:x.k,g:x.g||0,f:0,b:0,n:1};inst.b=basisMode==='paid'?paid:instSell(inst);
    const c=CARD[x.c];res.push({inst,card:c,isNew:!map[x.c]&&!seen[x.c],dupe:!!(map[x.c]||seen[x.c])});seen[x.c]=1;S.cards.push(inst);
    S.st.cards++;if(c.r>=2)S.st.rares++;if(c.r>=3)S.st.ultras++;if(c.r>=4)S.st.irs++;if(c.r>=5)S.st.secrets++;if(c.r>=6){S.st.legends++;if(x.k===0)S.st.impossible=1}
    const v=instValue(inst);if(v>S.st.bestPull){S.st.bestPull=v;S.st.bestPullCard=c.id}if(c.r>S.st.rarestR)S.st.rarestR=c.r});
  touchInv();_cv=null;return res}

  else{const cost=packPrice(p);if(!spend(p.cur,cost,'Bought '+p.n+' pack'))return {err:'Not enough '+p.cur};
    if(p.cur==='coins'){S.st.packSpent+=cost;addXP(wagerXP(cost,'pack'),'Pack purchase')}}
  const paidAmt=fromInv?0:packPrice(p);const rolled=rollPack(p),cards=addInstances(rolled,'pull');
  S.st.packs++;const best=cards[cards.length-1].card;
  addBP(30+best.r*15+(p.cur==='tickets'?30:0),'Opening a pack');

  const r={c:coins,bp:200};if(S.daily.streak%3===0)r.packs={starter:1};

const dailyReady=()=>S.daily.last!==dayKey();
const FREE_CD=30*60e3;

let AC=null;
function actx(){if(!S.settings.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d=.12,type='sine',vol=.12,delay=0,f2){const a=actx();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.3,vol=.1,delay=0,hp=800){const a=actx();if(!a)return;const t=a.currentTime+delay,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}

 case 'ir':[392,523,659,784,1047].forEach((f,i)=>tone(f,.3,'sine',.12,i*.08));noise(.5,.07,.3,3000);break;

/* ---------- higher or lower ---------- */
const HL_N=CARDS.length;

/* ---------- baccarat ---------- */
const BC={side:'P'};
const bcVal=k=>{const r=k%13;return r>=9?0:r+1};
const bcTot=h=>h.reduce((a,k)=>a+bcVal(k),0)%10;
const bcBDraw=(bt,v3)=>bt<=2?true:bt===3?v3!==8:bt===4?(v3>=2&&v3<=7):bt===5?(v3>=4&&v3<=7):bt===6?(v3===6||v3===7):false;
function bcPlay(dr){const p=[dr(),dr()],b=[dr(),dr()];const pt=bcTot(p),bt=bcTot(b);
  if(pt<8&&bt<8){let v3=null;if(pt<=5){const c=dr();p.push(c);v3=bcVal(c)}
    if(v3===null?bt<=5:bcBDraw(bt,v3))b.push(dr())}
  const P=bcTot(p),B=bcTot(b);return {p,b,P,B,win:P>B?'P':B>P?'B':'T'}}
let BCP=null;
function bcProbs(){if(BCP)return BCP;const pv=[4/13];for(let i=1;i<10;i++)pv.push(1/13);const r={P:0,B:0,T:0};
  const add=(pt,bt,w)=>{r[pt>bt?'P':bt>pt?'B':'T']+=w};
  for(let a=0;a<10;a++)for(let c=0;c<10;c++)for(let b=0;b<10;b++)for(let d=0;d<10;d++){const w=pv[a]*pv[c]*pv[b]*pv[d],pt=(a+c)%10,bt=(b+d)%10;
    if(pt>=8||bt>=8){add(pt,bt,w);continue}
    if(pt<=5){for(let e=0;e<10;e++){const w2=w*pv[e],pt2=(pt+e)%10;if(bcBDraw(bt,e)){for(let f=0;f<10;f++)add(pt2,(bt+f)%10,w2*pv[f])}else add(pt2,bt,w2)}}
    else if(bt<=5){for(let f=0;f<10;f++)add(pt,(bt+f)%10,w*pv[f])}else add(pt,bt,w)}
  return BCP=r}
const BC_PAY={P:2,B:1.95,T:9},BC_NAME={P:'Player',B:'Banker',T:'Tie'};
const bcTrail=()=>gs('baccarat').trail||(gs('baccarat').trail=[]);
const bcBeads=()=>{const t=bcTrail();return t.length?t.slice(-24).map(x=>`<span class="bc-b ${x}">${x}</span>`).join(''):'<span class="mu xs">Results show here</span>'};

  return `<div class="bc-wrap"><div class="bc-felt"><div class="bc-hand" id="bcPh"><div class="bc-lab"><b>PLAYER</b><span class="bc-tot" id="bcPt">-</span></div><div class="bc-cards" id="bcPc"></div></div><div class="bc-vs">VS</div><div class="bc-hand" id="bcBh"><div class="bc-lab"><b>BANKER</b><span class="bc-tot" id="bcBt">-</span></div><div class="bc-cards" id="bcBc"></div></div></div>

    <tr><td>Banker</td><td class="tr num">${(p.B*100).toFixed(2)}%</td><td class="tr num">0.95 : 1</td><td class="tr num">${(be*100).toFixed(2)}%</td></tr>
    <tr><td>Tie</td><td class="tr num">${(p.T*100).toFixed(2)}%</td><td class="tr num">8 : 1</td><td class="tr num">${(te*100).toFixed(2)}%</td></tr></tbody></table></div>

/* ---------- keno ---------- */
const KE={picks:[],risk:'classic'};
const kcomb=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
const kProb=(n,h)=>kcomb(10,h)*kcomb(30,n-h)/kcomb(40,n);
const KRISK={low:{n:'Low',b:.6,t:.2},classic:{n:'Classic',b:.32,t:.3},high:{n:'High',b:.1,t:.42}};
const KCAP=10000,KTARGET=.97,_kt={};
function kenoTable(n,risk){const key=n+risk;if(_kt[key])return _kt[key];const R=KRISK[risk],h0=Math.max(1,Math.ceil(n*R.t)),m=new Array(n+1).fill(0),lv=[];
  for(let h=h0;h<=n;h++)lv.push(h);
  const fixed=new Set();let left=KTARGET;
  for(let it=0;it<8;it++){let sw=0;lv.forEach(h=>{if(!fixed.has(h))sw+=Math.pow(kProb(n,h),R.b)});let ch=false;
    lv.forEach(h=>{if(fixed.has(h)){m[h]=KCAP;return}const sh=left*Math.pow(kProb(n,h),R.b)/sw;m[h]=sh/kProb(n,h);if(m[h]>KCAP){fixed.add(h);m[h]=KCAP;ch=true}});
    if(!ch)break;left=KTARGET;fixed.forEach(h=>left-=KCAP*kProb(n,h));if(left<=0)break}
  return _kt[key]=m.map(x=>Math.floor(Math.min(x,KCAP)*100)/100)}
const kenoRTP=(n,risk)=>kenoTable(n,risk).reduce((a,m,h)=>a+m*kProb(n,h),0);
function kePayHTML(hit){const n=KE.picks.length;if(!n)return '<div class="mu sm tc" style="width:100%">Pick 1 to 10 numbers to see the paytable.</div>';
  const tb=kenoTable(n,KE.risk);return tb.map((m,h)=>m>0?`<div class="ke-pc${hit===h?' on':''}" data-h="${h}"><span>${h} hit${h>1?'s':''}</span><b class="num">${m>=1000?fmtK(m):m}x</b></div>`:'').join('')}
GM.keno={html(){const n=KE.picks.length;

function mnRerender(){const g=$('.garea');if(!g)return;g.innerHTML=GM.mines.html();GM.mines.mount()}

const CKD={easy:{n:'Easy',p:.08,lanes:24},medium:{n:'Medium',p:.17,lanes:20},hard:{n:'Hard',p:.30,lanes:15},daredevil:{n:'Daredevil',p:.45,lanes:12}};
const CK={diff:'medium',last:null};
const ckMult=(d,k)=>.97/Math.pow(1-CKD[d].p,k);
const ckFmt=m=>m>=1000?fmtK(Math.floor(m)):m>=100?m.toFixed(0):m.toFixed(2);
const CHICK_SVG='<svg viewBox="0 0 44 44"><path d="M13 36v5M24 36v5" stroke="#ff9d2e" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="19" cy="27" rx="13" ry="11" fill="#fff"/><path d="M8 24q9-7 16 2q-6 9-16-2z" fill="#e4e0f6"/><circle cx="28" cy="15" r="8" fill="#fff"/><path d="M25 8q2-6 5-1 3-4 4 2z" fill="#ff4d6d"/><path d="M35 14l7 2.5-7 3z" fill="#ffc83d"/><circle cx="30.5" cy="13.5" r="1.6" fill="#14101f"/></svg>';
const CAR_SVG='<svg viewBox="0 0 30 60"><rect x="3" y="2" width="24" height="56" rx="9" fill="#ff4d6d" stroke="#7a1428" stroke-width="2"/><rect x="7" y="14" width="16" height="13" rx="3" fill="#14101f" opacity=".7"/><rect x="7" y="38" width="16" height="9" rx="3" fill="#14101f" opacity=".5"/><circle cx="8" cy="6" r="2.4" fill="#ffe27a"/><circle cx="22" cy="6" r="2.4" fill="#ffe27a"/></svg>';
function ckRoad(d,k,traps,dead){const D=CKD[d];let h=`<div class="ck-c start${k===0?' here':''}"><i>START</i></div>`;
  for(let i=0;i<D.lanes;i++){const n=i+1,passed=k>=n,here=k===n&&!dead,trap=traps&&traps[i],cls=(passed?' pass':'')+(here?' here':'')+(i===k&&!dead?' next':'')+(dead&&i===k?' hit':'')+(traps&&trap&&!(dead&&i===k)?' trap':'');
    h+=`<div class="ck-c lane${cls}" data-i="${i}"><em class="num">${ckFmt(ckMult(d,n))}x</em><div class="ck-roadline"></div>${trap&&traps?`<span class="ck-car">${CAR_SVG}</span>`:''}${passed?'<span class="ck-ok">✓</span>':''}</div>`}
  return h+`<div class="ck-c fin"><i>FINISH</i></div>`}
function ckChickX(k){return k*CKLW+CKLW/2}
const CKLW=62;
function ckScroll(k,smooth){const r=$('#ckroad');if(!r)return;const x=Math.max(0,ckChickX(k)-r.clientWidth*.4);if(smooth&&r.scrollTo)r.scrollTo({left:x,behavior:'smooth'});else r.scrollLeft=x}
GM.chicken={html(){const a=S.active.chicken,L=CK.last,d=a?a.diff:L?L.diff:CK.diff,D=CKD[d],k=a?a.k:L?L.k:0,dead=!!(L&&!a&&L.res==='bust');
  const traps=a?null:L?L.traps:null;const mult=k?ckMult(d,k):1,nx=k<D.lanes?ckMult(d,k+1):0,pay=a?Math.floor(a.bet*mult):0;
  const stats=`<div class="mn-top"><div class="kvbox"><span>Multiplier</span><b class="num gold" id="ckm">${mult.toFixed(2)}x</b></div><div class="kvbox"><span>${a?'Next lane':'Max win'}</span><b class="num" id="ckn">${a?(nx?nx.toFixed(2)+'x':'-'):ckFmt(ckMult(d,D.lanes))+'x'}</b></div><div class="kvbox"><span>Safe chance</span><b class="num">${((1-D.p)*100).toFixed(0)}%</b></div></div>`;
  const road=`<div class="ck-road" id="ckroad"><div class="ck-track" id="cktrack" style="width:${(D.lanes+2)*CKLW}px">${ckRoad(d,k,traps,dead)}<div class="ck-chick${dead?' dead':''}" id="ckchick" style="left:${ckChickX(k)}px">${CHICK_SVG}</div></div></div>`;
  if(a)return `<div class="ck-wrap">${stats}${road}<div class="cf-res tc" id="ckres">${k?`Cash out now for <b class="gold">${fmt(pay)}</b>`:'Tap Cross to start.'}</div>
    <div class="row" style="gap:8px"><button class="btn pri" style="flex:2" data-act="ckGo" id="ckgo">Cross next lane</button><button class="btn gold" style="flex:1" data-act="ckCash" id="ckcash" ${k?'':'disabled'}>Cash out</button></div></div>`;
  return `<div class="ck-wrap">${stats}${road}<div class="cf-res tc" id="ckres">${L?(L.res==='bust'?`<b class="redt">SPLAT. You lose ${fmt(L.bet)}.</b>`:`<b class="grn">Cashed out ${L.mult.toFixed(2)}x · +${fmt(L.pay-L.bet)}</b>`):'Pick a difficulty and place a bet.'}</div>
  <div class="row" style="gap:6px;flex-wrap:wrap">${Object.keys(CKD).map(x=>`<button class="tab${CK.diff===x?' on':''}" data-act="ckDiff" data-v="${x}">${CKD[x].n}</button>`).join('')}</div>
  <div class="mu sm">${D.lanes} lanes · each lane has a ${(D.p*100).toFixed(0)}% chance of a car</div>${betBox()}<button class="btn pri lg blk" data-act="ckStart">Start crossing</button></div>`},
  mount(){const a=S.active.chicken,L=CK.last,k=a?a.k:L?L.k:0;ckScroll(k,false)},
  odds(){const a=S.active.chicken,d=a?a.diff:CK.diff,D=CKD[d];return `<div class="sm">Every lane has an independent ${(D.p*100).toFixed(0)}% chance of a car, rolled by the provably-fair stream when the round starts. Multiplier after crossing k lanes = 0.97 ÷ ${(1-D.p).toFixed(2)}<sup>k</sup> (3% house edge). ${D.n} has ${D.lanes} lanes; reaching the end pays <b>${ckFmt(ckMult(d,D.lanes))}x</b> and cashes out automatically.</div>`}};
ACT.ckDiff=t=>{if(S.active.chicken||CG.lock)return;CK.diff=t.dataset.v;CK.last=null;const g=$('.garea');if(g){g.innerHTML=GM.chicken.html();GM.chicken.mount()}const o=$('.gview .stack > .pn');if(o)o.innerHTML=`<h3>Odds</h3>${GM.chicken.odds()}<h3 style="margin-top:14px">Your last bets</h3>${histList('chicken')}`};
ACT.ckStart=()=>{if(CG.lock||S.active.chicken)return;const b=getBet();if(!checkBet(b))return;if(!hold('chicken',b))return;const D=CKD[CK.diff],traps=[];for(let i=0;i<D.lanes;i++)traps.push(fr()<D.p);
  S.active.chicken={bet:b,diff:CK.diff,traps,k:0};CK.last=null;save();sfx('flip');const g=$('.garea');if(g){g.innerHTML=GM.chicken.html();GM.chicken.mount()}};
ACT.ckGo=()=>{const a=S.active.chicken;if(!a||CG.lock)return;const D=CKD[a.diff],next=a.k+1;CG.lock=true;const ch=$('#ckchick');if(ch){ch.style.left=ckChickX(next)+'px';ch.classList.add('hop')}ckScroll(next,true);sfx('flip');
  setTimeout(()=>{const lane=$(`.ck-c.lane[data-i="${next-1}"]`);if(ch)ch.classList.remove('hop');
    if(a.traps[next-1]){const L={bet:a.bet,diff:a.diff,traps:a.traps,k:a.k,res:'bust'};if(lane){lane.classList.add('hit','trap');if(!lane.querySelector('.ck-car'))lane.insertAdjacentHTML('beforeend',`<span class="ck-car">${CAR_SVG}</span>`)}if(ch)ch.classList.add('dead');sfx('bust');shakeApp(false);delete S.active.chicken;CK.last=L;
      settle('chicken',a.bet,0,{d:`${D.n} · hit a car on lane ${next}`});const r=$('#ckres');if(r)r.innerHTML=`<b class="redt">SPLAT. You lose ${fmt(a.bet)}.</b>`;
      setTimeout(()=>{CG.lock=false;if(CG.game==='chicken'){const g=$('.garea');if(g){g.innerHTML=GM.chicken.html();GM.chicken.mount()}}refreshGame()},1500);return}
    a.k=next;sfx('coin');save();CG.lock=false;if(lane){lane.classList.add('pass');lane.insertAdjacentHTML('beforeend','<span class="ck-ok">✓</span>')}
    const mult=ckMult(a.diff,next),pay=Math.floor(a.bet*mult);const m=$('#ckm');if(m)m.textContent=mult.toFixed(2)+'x';const n=$('#ckn');if(n)n.textContent=next<D.lanes?ckMult(a.diff,next+1).toFixed(2)+'x':'-';
    const r=$('#ckres');if(r)r.innerHTML=`Cash out now for <b class="gold">${fmt(pay)}</b>`;const cb=$('#ckcash');if(cb)cb.disabled=false;
    if(next>=D.lanes)ACT.ckCash()},430)};
ACT.ckCash=()=>{const a=S.active.chicken;if(!a||!a.k)return;const mult=ckMult(a.diff,a.k),pay=Math.floor(a.bet*mult);delete S.active.chicken;
  CK.last={bet:a.bet,diff:a.diff,traps:a.traps,k:a.k,res:'cash',mult,pay};S.st.ckWins++;const mm=Math.floor(mult*100)/100;if(mm>S.st.ckMax)S.st.ckMax=mm;
  settle('chicken',a.bet,pay,{d:`${CKD[a.diff].n} · cashed ${mult.toFixed(2)}x after ${a.k} lanes`});coinsFx(innerWidth/2,innerHeight/2,26);CG.lock=false;const g=$('.garea');if(g){g.innerHTML=GM.chicken.html();GM.chicken.mount()}refreshGame()};

ACT.friendToggle=t=>{const id=+t.dataset.v,k=S.friends.indexOf(id);if(k>=0)S.friends.splice(k,1);else{S.friends.push(id);toast(`<b>${esc(BOTS[id].name)}</b> accepted your friend request.`,'win')}S.st.friendsN=S.friends.length;touch();closeModal(true);render()};
function friendsView(){const fl=S.friends.map(i=>BOTS[i]);const sug=BOTS.filter(b=>!S.friends.includes(b.id)).slice(0,8);
  return `<div class="g2"><div class="pn"><h3>Friends (${fl.length})</h3>${fl.length?fl.map(b=>`<div class="lbr" data-act="viewBot" data-v="${b.id}">${avatarHTML(b.av,34,null)}<div style="flex:1;min-width:0"><b>${esc(b.name)}</b><div class="xs mu">${b.online?'<span class="grn">Online</span>':'Offline'} · ${VIP[vipLevel(botVal(b,'xp'))].n}</div></div></div>`).join(''):'<div class="empty">No friends yet. Add a few from the right.</div>'}</div>
  <div class="pn"><h3>Suggested players</h3>${sug.map(b=>`<div class="lbr"><span data-act="viewBot" data-v="${b.id}">${avatarHTML(b.av,34,null)}</span><div style="flex:1;min-width:0"><b>${esc(b.name)}</b><div class="xs mu">${b.online?'<span class="grn">Online</span>':'Offline'} · net worth ${fmtK(botVal(b,'coll'))}</div></div><button class="btn sm" data-act="friendToggle" data-v="${b.id}">Add</button></div>`).join('')}</div></div>`}

/* ---------- Events ---------- */
PAGE.events={live:true,html(){const ev=evSchedule().sort((a,b)=>(b.on-a.on)||a.s-b.s),live=ev.filter(e=>e.on),feat=live[0]||ev[0],tot=commTotal(),cm=COMM_MS;const mi=cm.findIndex(m=>tot<m),nx=mi<0?cm[cm.length-1]:cm[mi],pv=mi<=0?0:cm[mi-1];
  return `<div class="pagehead"><div><h1>Events</h1><p>Live boosts, limited packs and community goals. ${fxNow().names.length?`Active right now: <b class="grn">${fxNow().names.join(', ')}</b>.`:''}</p></div></div>
  <div class="pn feat" style="--ec:${feat.col}"><div class="evi big">${feat.ic}</div><div style="flex:1;min-width:220px"><span class="pill ${feat.on?'on':''}">${feat.on?'LIVE NOW':'UP NEXT'}</span><h2 style="margin:8px 0 4px">${esc(feat.n)}</h2><div class="mu">${esc(feat.d)}</div></div><div class="tc"><div class="mu xs">${feat.on?'ENDS IN':'STARTS IN'}</div><b class="big num" data-cd="${feat.on?feat.e:feat.s}">${cd((feat.on?feat.e:feat.s)-Date.now())}</b></div></div>
  <div class="g2" style="margin-top:14px">${ev.map(e=>evCard(e)).join('')}</div>
  <div class="pn" style="margin-top:14px"><h3>Community milestone</h3><div class="row sp"><div><b class="mid num">${fmt(tot)}</b> <span class="mu">packs opened by the community</span></div><span class="mu num">Next goal ${fmtK(nx)}</span></div><div class="bar" style="margin:10px 0"><i style="width:${mi<0?100:clamp((tot-pv)/(nx-pv)*100,0,100)}%"></i></div>
   <div class="row">${cm.map((m,i)=>{const ok=tot>=m,cl=S.commClaimed[m];return `<div class="cmile ${ok?'ok':''}"><b class="num">${fmtK(m)}</b><span class="xs mu">${rewardText(commRew(i))}</span>${ok?cl?'<span class="pill on">Claimed</span>':`<button class="btn sm grn" data-act="commClaim" data-v="${m}">Claim</button>`:'<span class="pill">Locked</span>'}</div>`}).join('')}</div></div>
  <div class="pn" style="margin-top:14px"><h3>Competition history</h3>${S.compHist.length?`<table class="tbl"><tbody>${S.compHist.slice(0,8).map(h=>`<tr><td class="xs mu">${new Date(h.t).toLocaleDateString()}</td><td>${h.kind==='weekly'?'Weekly':'Monthly VIP'}</td><td class="num">Rank #${h.rank}</td><td class="xs">${h.r?esc(rewardText(h.r)):'No prize'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No finished competitions yet. Wager in the casino to climb the weekly and monthly boards.</div>'}</div>`}};
const commRew=i=>({c:20000*(i+1)*(i+1),bp:300+i*200,tickets:i>=3?1+Math.floor(i/3):0,packs:i>=5?{cosmic:1+Math.floor(i/5)}:undefined});
ACT.commClaim=t=>{const m=+t.dataset.v,i=COMM_MS.indexOf(m);if(S.commClaimed[m]||commTotal()<m)return;S.commClaimed[m]=1;const r=commRew(i);Object.keys(r).forEach(k=>{if(r[k]===undefined||r[k]===0)delete r[k]});giveReward(r,'Community milestone '+fmtK(m));sfx('win');confetti(innerWidth/2,innerHeight/3,80);toast('Community reward: '+rewardText(r),'gold')};

/* ---------- Profile ---------- */
const PF=ps('profile',{tab:'me',wt:'sleeve'});
PAGE.profile={live:false,html(){const t=PF.tab;return `<div class="pagehead"><div><h1>Profile</h1><p>Your identity, cosmetics, showcase and settings.</p></div></div>${tabsHTML([['me','Overview'],['ward','Wardrobe'],['set','Settings']],t,'pfTab')}<div style="height:14px"></div>${t==='me'?pfMe():t==='ward'?pfWard():pfSet()}`},
  mount(){const n=$('#unm');if(n)n.addEventListener('keydown',e=>{if(e.key==='Enter')ACT.rename()})}};
ACT.pfTab=t=>{PF.tab=t.dataset.v;render()};
function pfMe(){const V=VIP[S.vipLv],sc=S.showcase.map(id=>S.cards.find(c=>c.i===id)).filter(Boolean),rk=myRanks();
  return `<div class="pn glow-pu"><div class="row pfid" style="gap:16px;flex-wrap:nowrap">${avatarHTML(S.av,84)}<div style="min-width:0;flex:1"><div class="row" style="gap:8px"><input id="unm" class="inp" value="${esc(S.name)}" maxlength="16" style="max-width:240px;font-family:var(--fd)"><button class="btn sm" data-act="rename">Rename</button></div><div class="row" style="gap:6px;margin-top:8px"><span class="pill pu">${esc(titleName())}</span><span class="pill" style="color:${V.c[0]}">VIP ${V.n}</span><span class="pill">Net worth rank #${rk.nw}</span></div></div>${vipBadge(S.vipLv,64)}</div>
  <h3 class="ph" style="margin-top:18px">Choose avatar</h3><div class="avs">${AVATARS.map((s,i)=>`<button class="avb${i===S.av?' on':''}" data-act="setAv" data-v="${i}" aria-label="Avatar ${i+1}">${avatarHTML(i,46)}</button>`).join('')}</div></div>
  <div class="g4" style="margin:14px 0"><div class="pn stat"><div class="mu xs">NET WORTH</div><b class="mid gold num">${fmtK(netWorth())}</b></div><div class="pn stat"><div class="mu xs">COLLECTION</div><b class="mid num">${compPct().toFixed(1)}%</b></div><div class="pn stat"><div class="mu xs">ACHIEVEMENTS</div><b class="mid num">${Object.keys(S.ach).length}/${ACH.length}</b></div><div class="pn stat"><div class="mu xs">FRIENDS</div><b class="mid num">${S.friends.length}</b></div></div>
  <div class="pn"><div class="row sp"><h3 style="margin:0">Showcase</h3><button class="btn sm" data-go="inv" data-act="showGo">Edit in Collection</button></div><div class="shelf">${[0,1,2,3,4,5].map(k=>{const i=sc[k];return i?`<div class="shelf-s" data-act="inspect" data-v="${i.i}">${cardHTML(CARD[i.c],{inst:i,val:instValue(i)})}</div>`:`<div class="shelf-s empty-s"><span>Empty</span></div>`}).join('')}</div></div>`}
ACT.showGo=()=>{INV.tab='show'};
ACT.setAv=t=>{S.av=+t.dataset.v;save();render();renderTop()};
ACT.rename=()=>{const v=$('#unm').value.trim();if(!/^[A-Za-z0-9_ ]{3,16}$/.test(v)){toast('Usernames are 3 to 16 letters, numbers, spaces or underscores.','lose');return}S.name=v;save(true);toast('Username updated.','win');renderTop()};
function pfWard(){const t=PF.wt,types=[['sleeve','Card sleeves'],['frame','Avatar frames'],['skin','Pack skins'],['title','Titles'],['emote','Emotes']];
  const all=[...FREE_COSMETICS,...Object.keys(S.own).map(id=>cosDef(id)).filter(Boolean)].filter((d,i,a)=>a.findIndex(x=>x.id===d.id)===i).filter(d=>d.type===t);
  const eq=t==='title'?S.eqTitle:(S.eq[t]||FREE_COSMETICS.find(c=>c.type===t)?.id);
  return `${tabsHTML(types,t,'wardTab')}<div class="mu sm" style="margin:10px 0">Earn cosmetics from the Battle Pass, VIP rewards and missions. ${t==='emote'?'Emotes appear as quick reactions in chat.':''}</div><div class="g4">${all.length?all.map(d=>`<div class="pn tc cosc ${d.id===eq?'eq':''}"><div class="cosp">${cosPreview(d,1)}</div><b class="sm">${esc(d.name)}</b>${d.ltd?'<div class="pill warn" style="margin-top:4px">LIMITED</div>':''}<div class="xs mu">${esc(d.seaName||'')}</div>${t==='emote'?'':`<button class="btn sm ${d.id===eq?'':'pri'}" style="margin-top:8px" data-act="equip" data-v="${d.id}" data-t="${t}">${d.id===eq?'Equipped':'Equip'}</button>`}</div>`).join(''):'<div class="empty pn">No items yet. Level up your Battle Pass.</div>'}</div>`}
ACT.wardTab=t=>{PF.wt=t.dataset.v;render()};
ACT.equip=t=>{if(t.dataset.t==='title')S.eqTitle=t.dataset.v;else S.eq[t.dataset.t]=t.dataset.v;save();sfx('click');render();renderTop()};
function pfSet(){const s=S.settings;return `<div class="stack"><div class="pn"><h3>Preferences</h3><div class="col1"><label class="row sp"><span>Sound effects</span><button class="btn sm ${s.sound?'grn':''}" data-act="setTog" data-k="sound">${s.sound?'On':'Off'}</button></label><label class="row sp"><span>Quick open (skip pack animation, still plays big hits)</span><button class="btn sm ${s.quick?'grn':''}" data-act="setTog" data-k="quick">${s.quick?'On':'Off'}</button></label><label class="row sp"><span>Random meme notifications</span><button class="btn sm ${s.memes!==false?'grn':''}" data-act="setTog" data-k="memes">${s.memes!==false?'On':'Off'}</button></label></div></div>
  <div class="pn"><h3>Save data</h3><div class="sm mu" style="margin-bottom:10px">Progress saves automatically in this browser. Export a backup code to move it elsewhere.</div><div class="row"><button class="btn" data-act="exportSave">Show backup code</button><button class="btn" data-act="importSave">Import backup</button></div><textarea id="savebox" class="inp" style="margin-top:10px;display:none;height:120px;font-size:11px"></textarea></div>
  <div class="pn" style="border-color:#ff4d6d55"><h3>Danger zone</h3><div class="sm mu" style="margin-bottom:10px">Resets your whole account: cards, currencies, VIP, pass and stats.</div><button class="btn red" data-act="resetAsk">Reset account</button> <button class="btn" data-act="logout">${CLOUD.uid?'Log out ('+esc(CLOUD.uid)+')':'Back to main menu'}</button></div>
  <div class="pn"><div class="sm mu" style="max-width:80ch">Pokémon Degen is a virtual-currency game. There are no deposits or withdrawals and nothing has real-world value. All creatures, cards and art are original and generated in code. Architecture note: <code>p2_engine</code> holds all rules and state as plain functions over one state object, so a server can reuse them for authoritative game logic and a database-backed inventory.</div></div></div>`}
ACT.setTog=t=>{const k=t.dataset.k;S.settings[k]=k==='memes'?(S.settings.memes===false):!S.settings[k];save();render()};
ACT.exportSave=()=>{const b=$('#savebox');b.style.display='block';b.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));b.select()};
ACT.importSave=()=>{const b=$('#savebox');if(b.style.display==='none'){b.style.display='block';b.value='';b.placeholder='Paste backup code, then press Import again';return}try{const o=JSON.parse(decodeURIComponent(escape(atob(b.value.trim()))));if(!o||o.v!==1||!o.cards)throw 0;const rv=S.rev||0,nm=S.name;S=mergeDefaults(o,newState());S.uid=CLOUD.uid;S.named=true;S.name=nm;S.rev=Math.max(rv,S.rev||0);initWorld();save(true);toast('Backup imported.','win');go('dash')}catch(e){toast('That backup code is not valid.','lose')}};
ACT.resetAsk=()=>{openModal(`<h2>Reset everything?</h2><p class="mu">This permanently deletes your cards, coins, progress and stats on this device.</p><div class="row" style="margin-top:14px"><button class="btn red" data-act="resetGo">Yes, reset</button><button class="btn" data-act="closeModal">Cancel</button></div>`,'narrow')};
ACT.resetGo=()=>{resetAll();closeModal(true);toast('Fresh account created. Good luck.','win');go('dash')};

/* ---------- boot ---------- */
function welcome(){S.settings.welcomed=true;save();openModal(`<div class="tc"><div style="width:96px;margin:0 auto" class="floaty">${spriteSVG(SPDEF.length+6,'10 30 180 160')}</div><h2 style="margin:10px 0 6px">Welcome to Pokémon Degen</h2><p class="mu" style="max-width:44ch;margin:0 auto">A virtual card-collecting and casino playground. You start with <b class="gold">10,000 coins</b>, 3 tickets and 3 free packs. Gems are rare (missions, Battle Pass, VIP level ups only): deposit one for 1,000 coins when you need to keep playing. Rip packs, hunt the Legendary, sell, trade, gamble and climb the VIP ranks.</p><div class="row" style="justify-content:center;margin:16px 0;gap:8px"><span class="pill pu">Virtual currency only</span><span class="pill">Original art</span><span class="pill on">Autosaves</span></div><button class="btn pri lg" data-act="welcomeGo">Open my first pack</button></div>`,'narrow')}
ACT.welcomeGo=()=>{closeModal(true);go('packs')};
function tickCountdowns(){const now=Date.now();$$('[data-cd]').forEach(e=>{const t=+e.dataset.cd,l=t-now;e.textContent=cd(l);if(l<=0&&e.dataset.cdr){delete e.dataset.cdr;softRefresh()}})}

/* ---------- accounts: main menu, register, login (username + password; no guest play) ---------- */
const AU={mode:'reg',busy:false,err:'',up:false};
const U_OK=/^[A-Za-z0-9_]{3,16}$/;
function authBox(){const reg=AU.mode==='reg';
  return `<div class="au-box"><div class="row" style="gap:6px;margin-bottom:6px"><button class="tab${reg?' on':''}" data-act="auMode" data-v="reg">Create account</button><button class="tab${reg?'':' on'}" data-act="auMode" data-v="login">Log in</button></div>
  ${AU.up?`<form id="auform" autocomplete="on"><label for="au-u">USERNAME</label><input id="au-u" class="inp" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="3 to 16 letters, numbers, _">
  <label for="au-p">PASSWORD</label><input id="au-p" class="inp" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="At least 6 characters">
  ${reg?`<label for="au-p2">CONFIRM PASSWORD</label><input id="au-p2" class="inp" type="password" autocomplete="new-password" placeholder="Type it again">`:''}
  <div class="au-err" id="au-err">${esc(AU.err)}</div><button class="btn pri lg blk" id="au-go" type="submit">${reg?'Create account and play':'Log in'}</button></form>
  <div class="au-note">${reg?'No email needed. Pick a username and password. You need an account to play, and other players can see your name on the leaderboards. Do not reuse a password from anywhere important.':'Welcome back. Your cards, coins and VIP rank are waiting.'}</div>`
  :`<div class="au-err" style="margin:14px 0">${esc(AU.err||'Could not reach the game server.')}</div><button class="btn pri blk" data-act="auRetry">Try again</button>`}</div>`}
function authHTML(){const legs=[0,3,5,6,7].map(k=>`<div class="au-sp floaty" style="animation-delay:${k*.3}s">${spriteSVG(NREG+k,'10 30 180 160')}</div>`).join('');
  const top=[...CARDS].sort((a,b)=>b.base-a.base).slice(0,4).map(c=>`<div>${cardHTML(c)}</div>`).join('');
  return `<div class="au-wrap"><div><div class="au-logo">POKÉMON<br>DEGEN</div><p class="au-tag">Rip packs. Hunt 180 unique creatures. Flip, crash and spin in the casino. Climb the VIP ranks and the live leaderboards. Virtual coins only.</p>
  <div class="row" style="gap:8px;flex-wrap:nowrap;overflow:hidden">${legs}</div><div class="au-cards">${top}</div>
  <div class="au-feat"><span class="pill pu">180 unique creatures</span><span class="pill">10 casino games</span><span class="pill">VIP club</span><span class="pill">Battle Pass</span><span class="pill on">Live leaderboards</span></div></div>
  <div id="au-form">${authBox()}</div></div>`}
function authRender(){const e=$('#auth');if(!e)return;const f=$('#au-form');if(f)f.innerHTML=authBox();const fm=$('#auform');if(fm)fm.addEventListener('submit',ev=>{ev.preventDefault();authSubmit()})}
function authErr(m){AU.err=m;const e=$('#au-err');if(e)e.textContent=m}
function removeAuth(){const e=$('#auth');if(e)e.remove();document.body.style.overflow=''}
ACT.auMode=t=>{AU.mode=t.dataset.v;AU.err='';authRender()};
ACT.auRetry=()=>{AU.err='';authStart(true)};
ACT.logout=async()=>{try{if(CLOUD.uid&&!CLOUD.stale)await API.call('PUT','/save',savePayload())}catch(e){}try{await API.call('POST','/logout')}catch(e){}try{localStorage.removeItem('pd_tok')}catch(e){}location.reload()};
async function authSubmit(){if(AU.busy)return;const u=$('#au-u').value.trim(),pw=$('#au-p').value,reg=AU.mode==='reg';
  if(!U_OK.test(u))return authErr('Username: 3 to 16 letters, numbers or underscores.');
  if(pw.length<6)return authErr('Password must be at least 6 characters.');
  if(reg&&pw!==$('#au-p2').value)return authErr('Passwords do not match.');
  AU.busy=true;const b=$('#au-go');if(b){b.disabled=true;b.textContent='One moment...'}authErr('');
  try{const r=await API.call('POST',reg?'/register':'/login',{u,p:pw});CLOUD.tok=r.token;try{localStorage.setItem('pd_tok',r.token)}catch(e){}await enterGame(r.u,r.name,!!r.isNew)}
  catch(e){CLOUD.tok=null;CLOUD.uid=null;authErr(e.message||'Something went wrong. Try again.')}
  AU.busy=false;const b2=$('#au-go');if(b2){b2.disabled=false;b2.textContent=reg?'Create account and play':'Log in'}}
let SESSION_ON=false;
async function enterGame(u,display,isNew){
  const sv=await API.call('GET','/save');
  CLOUD.uid=u;
  let srv=null;if(sv.json){try{srv=JSON.parse(sv.json)}catch(e){}}
  const loc=readLocal(u);
  // newest copy wins: a local cache with unsynced progress beats an older cloud save
  const base=loc&&(!srv||(loc.rev||0)>(srv.rev||0))?loc:srv;
  S=base?mergeDefaults(base,newState()):newState();
  if(!S.mk&&loc&&loc.mk)S.mk=loc.mk;
  if(sv.daily&&sv.daily>(S.daily.last||''))S.daily.last=sv.daily;   // the server remembers the last daily claim
  S.rev=Math.max(S.rev||0,sv.rev||0);S.uid=u;
  if(isNew||!S.named){S.name=display.slice(0,18);S.named=true}
  startSession(!!(S.mk&&base));
  removeAuth();closeModal(true);go('dash',true);
  toast(`Signed in as <b>${esc(S.name)}</b>. Your progress is saved to your account.`,'win');
  if(!S.settings.welcomed)setTimeout(welcome,300)}
function startSession(had){
  initWorld();if(S.active.crash){const b=S.active.crash.bet;delete S.active.crash;S.st.crashBusts++;settle('crash',b,0,{d:'page closed mid-round'})}
  if(S.active.bjo){const b=S.active.bjo.stake;delete S.active.bjo;settle('blackjack',b,0,{d:'page closed mid-round'})}
  if(had)catchUp();buildShell();ensurePeriods();checkAch();CLOUD.status='synced';
  if(SESSION_ON){doSave();return}SESSION_ON=true;
  const flush=()=>{doSave();clearTimeout(cloudT);cloudT=0;flushBeacon()};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});addEventListener('pagehide',flush);
  setInterval(tickCountdowns,1000);setInterval(()=>{marketTick();ensurePeriods()},12000);setInterval(feedTick,9000);
  setInterval(()=>{if(S.settings.memes!==false&&!BUSY&&!MODAL&&Math.random()<.6)toast(pickOne(MEME_N),'meme',5000)},65000);
  addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGE[h]&&h!==CUR)go(h)});
  setInterval(pollPlayers,15000);setInterval(()=>{if(CUR==='social'&&SO.tab==='chat')pollChat()},3000);setInterval(()=>{if(CUR!=='social'||SO.tab!=='chat')pollChat()},25000);
  pollPlayers();pollChat();doSave()}
async function authStart(retry){
  let el=$('#auth');
  if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el);document.body.style.overflow='hidden'}
  el.innerHTML=`<div class="au-wrap"><div class="tc mu" style="grid-column:1/-1">Loading...</div></div>`;
  let tok=null;try{tok=localStorage.getItem('pd_tok')}catch(e){}
  AU.up=false;
  try{const h=await API.call('GET','/health');AU.up=!!h.ok}catch(e){AU.err=e.message}
  if(AU.up&&tok){CLOUD.tok=tok;
    try{const me=await API.call('GET','/me');await enterGame(me.u,me.name,false);return}
    catch(e){if(e.status===401){CLOUD.tok=null;CLOUD.uid=null;try{localStorage.removeItem('pd_tok')}catch(x){}}else if(e.net){AU.up=false;AU.err=e.message}}}
  el.innerHTML=authHTML();authRender()}
function boot(){S=newState();authStart()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
